{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Change Password" %} - Moneybots{% endblock %}

{% block content %}
<style>
.auth-page-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
    background: #050508;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

.auth-card {
    background: #0f0f16;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 24px;
    padding: 56px 48px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 20px 40px rgba(0, 0, 0, 0.4);
    text-align: center;
}

.auth-header h1 {
    color: #ffffff;
    font-size: 32px;
    margin-bottom: 12px;
    font-weight: 600;
    letter-spacing: -0.02em;
}

.auth-header p {
    color: rgba(255, 255, 255, 0.5);
    font-size: 15px;
    margin: 0 0 32px;
    line-height: 1.5;
}

.auth-icon {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
    color: #00a79e;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 24px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    width: 100%;
}

.btn-primary {
    background: #00a79e;
    color: #ffffff;
}

.btn-primary:hover {
    background: #00b8af;
}

.auth-footer a {
    color: #00a79e;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
}

.auth-footer a:hover {
    color: #00c4b8;
}
</style>

<div class="auth-page-container">
    <div class="auth-card">
        <div class="auth-icon" aria-hidden="true">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <polyline points="9 12 11 14 15 10"/>
            </svg>
        </div>

        <div class="auth-header">
            <h1>{% trans "Change Password" %}</h1>
            <p>{% trans "Your password is now changed." %}</p>
        </div>

        <a href="{% url 'account_login' %}" class="btn btn-primary">{% trans "Sign in" %}</a>
    </div>
</div>
{% endblock %}
